name: "Welcome & Guide Contributors"

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Add welcome comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPR = !!context.payload.pull_request;
            const user = (isPR ? context.payload.pull_request.user.login : context.payload.issue.user.login);
            const body = isPR
              ? `Thanks for your Pull Request, @${user}! 🎉

Here’s how to make this go smoothly:
1. Make sure your PR uses the template (description + type of change + checklist).
2. Link any related issue with \`Closes #<number>\`.
3. If you’re adding content (exercises, prompts), check the JSON format matches existing entries.

If you’re new here and unsure about anything, comment below and we’ll help.`
              : `Hi @${user}, thanks for opening this issue! 🙌

If this is a contribution request:
1. Fork the repo.
2. Comment on an existing \`good first issue\` to claim it.
3. Open a PR and link this issue with \`Closes #${context.payload.issue.number}\`.

Check CONTRIBUTING.md for step-by-step instructions.`;

            const issue_number = isPR ? context.payload.pull_request.number : context.payload.issue.number;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body,
            });
